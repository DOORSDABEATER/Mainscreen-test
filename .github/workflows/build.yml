
name: Build DESECHO

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!*.jar'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found!"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build plugin
        run: gradle build --no-daemon

      - name: Upload DESECHO JAR
        uses: actions/upload-artifact@v4
        with:
          name: DESECHO
          path: plugin/build/libs/DESECHO.jar
          if-no-files-found: error
          
