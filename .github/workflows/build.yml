name: Build DESECHO

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile DESECHO Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build DESECHO
        run: gradle build --no-daemon

      - name: Verify JAR exists
        run: |
          test -f plugin/build/libs/DESECHO.jar
          ls -lh plugin/build/libs/DESECHO.jar

      - name: Upload DESECHO JAR
        uses: actions/upload-artifact@v4
        with:
          name: DESECHO-Plugin
          path: plugin/build/libs/DESECHO.jar
          if-no-files-found: error
          retention-days: 14
