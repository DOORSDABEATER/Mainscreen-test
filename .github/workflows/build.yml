name: Build DESECHO

on:
push:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Extract and Build DESECHO
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install unzip
    run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Extract DESECHO source
    run: |
      mkdir -p source
      unzip -q desecho-task4-reviewed.zip -d source

      echo "Extracted project:"
      find source -maxdepth 2 -type f | head -50

  - name: Verify Gradle project
    run: |
      test -f source/settings.gradle.kts
      test -f source/build.gradle.kts
      test -f source/plugin/build.gradle.kts
      echo "Gradle project found!"

  - name: Set up Java 25
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '25'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.1.0'

  - name: Build DESECHO
    run: gradle -p source build --no-daemon

  - name: Verify plugin JAR
    run: |
      ls -lh source/plugin/build/libs/
      test -f source/plugin/build/libs/DESECHO.jar

  - name: Upload DESECHO JAR
    uses: actions/upload-artifact@v4
    with:
      name: DESECHO-Plugin
      path: source/plugin/build/libs/DESECHO.jar
      if-no-files-found: error
      retention-days: 14
