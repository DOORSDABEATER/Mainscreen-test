
name: Build DESECHO

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!*.jar'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE" || {
            echo "Source ZIP not found!"
            exit 1
          }
          unzip -o "$ZIP_FILE" -d .

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Add correct Plasmo Voice API module
        run: |
          sed -i '/server-proxy-common/d' plugin/build.gradle.kts
          sed -i '/server-common/d' plugin/build.gradle.kts
          sed -i '/compileOnly("su.plo.voice.api:server:/a\    compileOnly("su.plo.voice:server-proxy-common:$plasmoVoiceApiVersion")' plugin/build.gradle.kts

      - name: Build DESECHO
        run: gradle :plugin:shadowJar --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DESECHO
          path: plugin/build/libs/DESECHO.jar
          if-no-files-found: error
        
